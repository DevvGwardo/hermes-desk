<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Desk · Design system</title>
  <style>
    html, body, #root { margin: 0; min-height: 100%; }
    body { background: #09090b; }
    button, summary { -webkit-tap-highlight-color: transparent; }
    .app { height: calc(100vh - 32px); margin: 16px; overflow: hidden; border: 1px solid var(--desk-hairline-strong); border-radius: var(--desk-radius-md); background: var(--desk-surface-1); box-shadow: var(--desk-shadow-modal); }
    .window-chrome { height: 32px; display: flex; align-items: center; justify-content: center; position: relative; background: var(--desk-surface-2); border-bottom: 1px solid var(--desk-hairline); color: var(--desk-text-secondary); font-size: var(--desk-type-11); font-weight: var(--desk-weight-medium); }
    .traffic { display: flex; gap: 8px; position: absolute; left: 12px; }
    .traffic i { width: 10px; height: 10px; border-radius: 50%; background: #fb6b64; }
    .traffic i:nth-child(2) { background: #efbd50; }.traffic i:nth-child(3) { background: #60c156; }
    .columns { height: calc(100% - 32px); display: grid; grid-template-columns: 248px minmax(0, 1fr) minmax(0, 1fr); }
    .sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--desk-surface-1); border-right: 1px solid var(--desk-hairline); }
    .sidebar-head { display: flex; align-items: center; padding: 0 12px 0 20px; height: 64px; flex-shrink: 0; gap: 4px; }
    .sidebar-head strong { flex: 1; font-size: var(--desk-type-15); font-weight: var(--desk-weight-semibold); letter-spacing: -.3px; }
    .roster { padding: 0 8px; overflow: auto; flex: 1; }
    .eyebrow { color: var(--desk-text-tertiary); font-size: var(--desk-type-11); line-height: var(--desk-leading-11); font-weight: var(--desk-weight-medium); letter-spacing: .9px; text-transform: uppercase; }
    .roster-label { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 8px; }
    .roster .desk-list-row { min-height: 76px; padding: 12px; margin: 2px 0; gap: 8px; }
    .roster .desk-list-row-leading { border-radius: 50%; background: var(--desk-surface-2); }
    .roster .desk-list-row[data-selected="true"] .desk-list-row-leading { background: var(--desk-surface-4); }
    .roster .desk-list-row-trailing { flex-direction: column; align-items: flex-end; gap: 4px; min-width: 20px; }
    .row-time { font-size: var(--desk-type-11); line-height: var(--desk-leading-11); color: var(--desk-text-tertiary); font-weight: var(--desk-weight-regular); }
    .row-live { color: var(--desk-agent-accent); display: inline-flex; gap: 4px; align-items: center; }
    .row-live .desk-icon { display: inline-block; }
    .sidebar-bottom { border-top: 1px solid var(--desk-hairline); padding: 8px 12px 0; flex-shrink: 0; }
    .agent-card { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 8px; padding: 8px; background: transparent; border: 0; border-radius: var(--desk-radius-sm); text-align: left; color: var(--desk-text-primary); cursor: pointer; }
    .agent-card:hover { background: var(--desk-surface-2); }.agent-card:focus-visible { outline: 2px solid var(--desk-focus-ring); outline-offset: 2px; }
    .agent-card-text { display: flex; flex: 1; flex-direction: column; min-width: 0; }
    .agent-card-text strong { font-size: var(--desk-type-13); font-weight: var(--desk-weight-semibold); }
    .agent-card-text span { font-size: var(--desk-type-11); color: var(--desk-text-tertiary); }
    .sidebar-settings { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; }
    .connector-strip { display: flex; gap: 12px; align-items: center; justify-content: center; border-top: 1px solid var(--desk-hairline); min-height: 32px; margin: 0 -12px; font-size: var(--desk-type-11); color: var(--desk-text-tertiary); }
    .connector-strip span { display: inline-flex; gap: 4px; align-items: center; }
    .connector-strip .desk-status-dot { width: 4px; height: 4px; color: var(--desk-success); }
    .connector-strip .unavailable { color: var(--desk-text-tertiary); }
    .chat { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--desk-surface-2); border-right: 1px solid var(--desk-hairline); }
    .chat-header { flex-shrink: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; align-items: center; height: 64px; padding: 0 12px; border-bottom: 1px solid var(--desk-hairline); background: var(--desk-surface-1); }
    .chat-header .header-title { display: flex; justify-content: center; min-width: 0; }
    .header-agent { min-height: 36px; gap: 8px; padding: 0 12px 0 4px; border-radius: var(--desk-radius-pill); background: var(--desk-surface-3); border: 0; color: var(--desk-text-primary); cursor: pointer; display: flex; align-items: center; font-weight: var(--desk-weight-semibold); }
    .header-agent:focus-visible { outline: 2px solid var(--desk-focus-ring); outline-offset: 2px; }
    .header-trailing { display: flex; gap: 4px; justify-content: flex-end; }
    .transcript { padding: 20px 24px 12px; overflow-y: auto; flex: 1; min-height: 0; }
    .date { display: flex; justify-content: center; margin: 0 0 20px; }
    .date .desk-pill { background: var(--desk-surface-1); border: 0; }
    .turn { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 16px; gap: 8px; }
    .turn.out { align-items: flex-end; }
    .bubble { padding: 12px 16px 8px; border-radius: var(--desk-radius-bubble); max-width: 86%; font-size: var(--desk-type-15); line-height: var(--desk-leading-15); overflow-wrap: anywhere; }
    .bubble.incoming { background: var(--desk-surface-3); border-bottom-left-radius: var(--desk-radius-tail); }
    .bubble.outgoing { background: var(--desk-surface-4); border-bottom-right-radius: var(--desk-radius-tail); max-width: 72%; }
    .bubble p { margin: 0 0 12px; }.bubble p:last-of-type { margin-bottom: 8px; }
    .bubble ul { margin: 0 0 12px; padding-left: 20px; }.bubble li { margin: 4px 0; }
    .bubble strong { font-weight: var(--desk-weight-semibold); }
    .bubble a { color: var(--desk-agent-accent); text-decoration: underline; text-underline-offset: 3px; }
    .bubble code { font: var(--desk-type-13)/var(--desk-leading-13) var(--desk-font-mono); padding: 2px 4px; border-radius: var(--desk-radius-xs); color: var(--desk-text-primary); background: var(--desk-surface-2); }
    .timestamp { display: flex; align-items: center; justify-content: flex-end; gap: 4px; color: var(--desk-text-tertiary); font-size: var(--desk-type-11); line-height: var(--desk-leading-11); font-variant-numeric: tabular-nums; }
    .timestamp .desk-icon { color: var(--desk-agent-accent); }
    .reply-quote { border-left: 3px solid var(--desk-agent-accent); background: var(--desk-surface-2); border-radius: 0 var(--desk-radius-xs) var(--desk-radius-xs) 0; padding: 8px 12px; margin-bottom: 12px; font-size: var(--desk-type-12); line-height: var(--desk-leading-12); }
    .reply-quote strong { display: block; color: var(--desk-agent-accent); margin-bottom: 4px; }
    .reasoning { margin: -4px 0 4px; color: var(--desk-text-secondary); font-size: var(--desk-type-12); line-height: var(--desk-leading-12); }
    summary { list-style: none; min-height: 28px; display: flex; align-items: center; gap: 4px; cursor: pointer; border-radius: var(--desk-radius-xs); }
    summary::-webkit-details-marker { display: none; }
    details[open] > summary > .disclosure { transform: rotate(90deg); }
    .reasoning summary > span:last-child { margin-left: auto; color: var(--desk-text-tertiary); }
    .reasoning p { padding: 4px 0 8px; }
    .steps { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--desk-hairline-strong); font-size: var(--desk-type-12); line-height: var(--desk-leading-12); }
    .steps summary { color: var(--desk-text-secondary); gap: 4px; }.steps summary .duration { margin-left: auto; }
    .tool-row { display: flex; align-items: center; min-height: 32px; gap: 8px; color: var(--desk-text-secondary); }
    .tool-row .tool-label { flex: 1; min-width: 0; }
    .tool-row .duration { font-variant-numeric: tabular-nums; color: var(--desk-text-tertiary); font-size: var(--desk-type-11); white-space: nowrap; }
    .tool-row .state-done { color: var(--desk-success); }.tool-row .state-running { color: var(--desk-agent-accent); }.tool-row .state-failed { color: var(--desk-danger); }
    .answer-label { color: var(--desk-text-primary); margin-bottom: 8px !important; font-weight: var(--desk-weight-semibold); }
    .source-link { display: inline-flex; align-items: center; gap: 4px; color: var(--desk-agent-accent); font-size: var(--desk-type-12); line-height: var(--desk-leading-12); min-height: 28px; }
    .bubble-actions { height: 32px; display: flex; align-items: center; gap: 4px; color: var(--desk-text-tertiary); }
    .composer { border-top: 1px solid var(--desk-hairline); background: var(--desk-surface-1); padding: 12px 16px 8px; flex-shrink: 0; }
    .composer-controls { display: flex; align-items: flex-end; gap: 4px; }
    .composer-field { display: flex; align-items: center; flex: 1; min-width: 0; border: 1px solid var(--desk-control-border); border-radius: 22px; background: var(--desk-surface-3); padding: 4px; margin: 0 4px; min-height: 44px; }
    .composer-field textarea { min-width: 0; width: 100%; resize: none; min-height: 32px; height: 32px; padding: 6px 8px; background: transparent; border: 0; font-size: var(--desk-type-15); line-height: var(--desk-leading-15); outline-offset: 0; border-radius: var(--desk-radius-sm); }
    .composer-field:focus-within { outline: 2px solid var(--desk-focus-ring); outline-offset: 2px; }
    .composer-field textarea:focus-visible { outline: 0; }
    .composer-meta { display: flex; justify-content: center; gap: 4px; align-items: center; margin-top: 8px; color: var(--desk-text-tertiary); font-size: var(--desk-type-11); line-height: var(--desk-leading-11); }
    .workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--desk-surface-1); }
    .workspace-header { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 16px; border-bottom: 1px solid var(--desk-hairline); flex-shrink: 0; }

    .workspace-heading .eyebrow { display: flex; gap: 8px; }.workspace-heading .eyebrow span { font-weight: var(--desk-weight-regular); letter-spacing: .4px; }
    .workspace-tabbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; background: var(--desk-surface-1); flex-shrink: 0; }
    .browser-tab { min-height: 32px; display: flex; align-items: center; gap: 4px; border-radius: 8px 8px 0 0; padding: 0 4px 0 8px; border: 1px solid var(--desk-hairline); border-bottom: 0; background: var(--desk-surface-3); font-size: var(--desk-type-12); color: var(--desk-text-primary); min-width: 0; }
    .browser-tab > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }.browser-tab.inactive { background: var(--desk-surface-1); color: var(--desk-text-secondary); }
    .browser-nav { gap: 0; padding: 8px; background: var(--desk-surface-3); border-bottom: 1px solid var(--desk-hairline-strong); min-height: 48px; flex-shrink: 0; }
    .url { display: flex; align-items: center; gap: 8px; height: 32px; min-width: 0; flex: 1; padding: 0 8px; border: 1px solid var(--desk-control-border); border-radius: var(--desk-radius-sm); background: var(--desk-surface-2); color: var(--desk-text-secondary); margin: 0 4px; }
    .url input { width: 100%; min-width: 0; background: transparent; border: 0; min-height: 28px; outline-offset: 0; font-size: var(--desk-type-12); padding: 0; }
    .url:focus-within { outline: 2px solid var(--desk-focus-ring); outline-offset: 2px; }.url input:focus-visible { outline: 0; }
    .web-page { background: #eeeeea; color: #283027; flex: 1; min-height: 0; overflow: hidden; position: relative; }
    .web-site { padding: 28px 32px; height: 100%; }
    .web-site-nav { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #bdc4b8; padding-bottom: 16px; font-size: 12px; color: #535d4f; }

    .web-site-nav span { display: flex; gap: 16px; }

    .web-site .web-deck { font-size: 14px; line-height: 22px; color: #505d49; max-width: 400px; margin: 0; }
    .web-landscape { height: 148px; margin: 24px 0; background: #d5dbcd; position: relative; overflow: hidden; border-radius: 4px; }

    .web-landscape .hill { position: absolute; width: 110%; height: 170px; border-radius: 50% 50% 0 0; background: #95a589; bottom: -104px; left: -32px; transform: rotate(-8deg); }
    .web-landscape .hill.two { background: #677e60; bottom: -138px; left: 100px; transform: rotate(10deg); }

    .web-section strong { font: 20px Georgia, serif; }.web-section span { font-size: 11px; }
    .ghost-cursor { position: absolute; right: 28px; top: 40%; display: flex; flex-direction: column; align-items: flex-start; }
    .ghost-cursor svg { color: var(--desk-agent-accent); filter: drop-shadow(0 1px 1px #0008); }
    .ghost-cursor span { margin-left: 12px; padding: 2px 8px; border-radius: 4px; background: var(--desk-agent-accent); color: var(--desk-agent-ink); font-size: 11px; line-height: 16px; }
    .control-banner { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px; color: var(--desk-agent-accent); background: var(--desk-agent-surface); border-top: 1px solid var(--desk-hairline); flex-shrink: 0; }
    .control-banner span { flex: 1; font-size: var(--desk-type-12); }.control-banner .desk-button { font-size: var(--desk-type-12); }

    .board-head p { margin: 0; color: var(--desk-text-secondary); }
    .board-grid { display: grid; grid-template-columns: 272px minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    .surface { padding: 16px; background: var(--desk-surface-1); border: 1px solid var(--desk-hairline); border-radius: var(--desk-radius-md); min-width: 0; }
    .surface-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .surface-label h2 { margin: 0; font-size: var(--desk-type-13); font-weight: var(--desk-weight-semibold); }
    .surface-label span { color: var(--desk-text-tertiary); font-size: var(--desk-type-11); }
    .board-side { display: flex; flex-direction: column; gap: 20px; }
    .surface .roster { padding: 0; overflow: visible; }.surface .roster .desk-list-row { padding-left: 8px; padding-right: 8px; }
    .surface .sidebar-bottom { padding: 8px 0 0; border: 0; }.surface .sidebar-head { padding: 0; height: 48px; }
    .surface .connector-strip { margin: 0; gap: 8px; }
    .surface .bubble { max-width: 100%; }.surface .bubble.outgoing { max-width: 80%; }
    .surface .chat-header { padding: 0; border-radius: 8px; margin-bottom: 16px; grid-template-columns: 40px minmax(0, 1fr) 72px; height: 48px; border: 0; }
    .surface .composer { margin: 16px -16px -16px; border-radius: 0 0 12px 12px; padding: 12px 8px 8px; }
    .surface .workspace { border: 1px solid var(--desk-hairline); border-radius: 8px; overflow: hidden; }
    .surface .workspace-header { height: 56px; padding: 0 12px; }.surface .workspace-status { min-height: 32px; }.surface .browser-nav { padding: 4px; }
    .settings-heading { display: flex; gap: 8px; align-items: center; font-size: var(--desk-type-20); font-weight: var(--desk-weight-semibold); margin: 0 0 16px; }
    .settings-frame { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 16px; }
    .settings-nav { display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--desk-hairline); padding-right: 12px; }
    .settings-nav .desk-button { justify-content: flex-start; padding: 4px 8px; font-size: var(--desk-type-12); gap: 4px; }
    .settings-nav .selected { background: var(--desk-agent-surface); color: var(--desk-agent-accent); }
    .setting-card { padding: 12px; background: var(--desk-surface-2); border: 1px solid var(--desk-hairline); border-radius: var(--desk-radius-sm); margin-bottom: 12px; }
    .setting-card .desk-section-title { font-size: var(--desk-type-13); }.setting-card .desk-section-header { margin-bottom: 8px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: var(--desk-type-12); min-height: 32px; }
    .setting-row .value { color: var(--desk-text-secondary); font-size: var(--desk-type-11); }
    .setting-note { font-size: var(--desk-type-11); line-height: var(--desk-leading-11); color: var(--desk-text-tertiary); margin: 8px 0 0; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 20px 20px; min-height: 184px; }
    .empty-state h3 { margin: 8px 0 4px; font-size: var(--desk-type-15); line-height: var(--desk-leading-15); font-weight: var(--desk-weight-semibold); }
    .empty-state p { margin: 0 0 12px; color: var(--desk-text-secondary); font-size: var(--desk-type-12); line-height: var(--desk-leading-12); max-width: 260px; }
    .error-state { padding: 12px; border-radius: var(--desk-radius-sm); background: var(--desk-danger-surface); }
    .error-state strong { display: flex; align-items: center; gap: 8px; color: var(--desk-danger); font-size: var(--desk-type-13); font-weight: var(--desk-weight-semibold); }
    .error-state p { margin: 4px 0 8px; color: var(--desk-text-secondary); font-size: var(--desk-type-12); line-height: var(--desk-leading-12); }
    .error-actions { display: flex; gap: 8px; }.error-actions .desk-button { font-size: var(--desk-type-12); }
    .primitives { display: flex; flex-direction: column; gap: 12px; }.primitive-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .swatches { display: flex; gap: 8px; }.swatch { display: flex; flex: 1; flex-direction: column; align-items: center; gap: 4px; color: var(--desk-text-tertiary); font-size: var(--desk-type-11); }
    .swatch i { width: 32px; height: 32px; border: 1px solid var(--desk-hairline-strong); border-radius: 8px; }
    .icon-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 12px; color: var(--desk-text-secondary); padding-top: 4px; }.icon-grid > span { display: flex; justify-content: center; }
    .board-note { display: flex; gap: 8px; align-items: center; color: var(--desk-text-tertiary); font-size: var(--desk-type-11); margin-top: 20px; }
    .board-note .desk-icon { color: var(--desk-success); }.board-note span:last-child { margin-left: auto; }
    .tool-samples { padding: 8px 12px; background: var(--desk-surface-3); border-radius: var(--desk-radius-sm); }.tool-samples .tool-row { min-height: 36px; }
    .system-samples { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 12px 0 0; }
    .pip { border: 1px solid var(--desk-hairline-strong); border-radius: var(--desk-radius-sm); overflow: hidden; background: var(--desk-surface-2); margin-top: 12px; }
    .pip-head { display: flex; align-items: center; gap: 8px; padding: 4px 8px; min-height: 40px; }.pip-head strong { flex: 1; font-size: var(--desk-type-12); font-weight: var(--desk-weight-medium); }
    .pip-preview { display: flex; align-items: center; justify-content: center; gap: 12px; height: 64px; border-top: 1px solid var(--desk-hairline); color: var(--desk-text-secondary); }
    .pip-preview span { font-size: var(--desk-type-11); }.pip-foot { padding: 4px 8px; border-top: 1px solid var(--desk-hairline); color: var(--desk-text-tertiary); font-size: var(--desk-type-11); }

      .app { margin: 12px; height: calc(100vh - 24px); }.columns { grid-template-columns: 212px minmax(0, 1fr) 352px; }
      .sidebar-head { padding-left: 16px; }.roster .desk-list-row { padding: 8px; gap: 8px; }
      .transcript { padding: 16px 16px 8px; }.bubble { max-width: 96%; padding: 12px 12px 8px; }.bubble.outgoing { max-width: 82%; }
      .chat-header { padding: 0 8px; grid-template-columns: 36px minmax(0, 1fr) 72px; }.header-agent { font-size: var(--desk-type-12); padding-right: 8px; gap: 4px; }
