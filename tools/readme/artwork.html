<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Desk README artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0e0e10; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; color: #f2f2f5; }
    #artwork { width: 1600px; position: relative; overflow: hidden; background: #0e0e10; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 64px; line-height: 1.08; letter-spacing: -2.5px; font-weight: 650; }
    .deck { font-size: 28px; line-height: 1.5; color: #c4c4ce; margin-top: 16px; }
    .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: 2px; color: #a7ceff; text-transform: uppercase; }
    .pill { display: inline-flex; align-items: center; border: 1px solid #627c99; border-radius: 40px; padding: 12px 22px; font-size: 18px; letter-spacing: 1.5px; color: #a7ceff; }
    .owl { display: inline-block; flex-shrink: 0; line-height: 0; }
    .icon { width: 44px; height: 44px; color: #a7ceff; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .footer { position: absolute; left: 80px; bottom: 44px; color: #adadb9; font-size: 19px; }
    .small-owl { position: absolute; right: 62px; top: 35px; }

    .banner { height: 800px; background: #0e0e10 url('./hero-background.png') center / cover !important; }
    .banner-copy { position: absolute; left: 88px; top: 128px; z-index: 2; }
    .banner h1 { font-size: 112px; letter-spacing: -5px; margin: 42px 0 22px; }
    .banner .deck { font-size: 43px; line-height: 1.35; margin: 0; }
    .banner .hero-owl { position: absolute; left: 980px; top: 112px; z-index: 2; }
    .banner .perch { position: absolute; left: 1063px; top: 609px; width: 392px; height: 3px; background: #526378; }
    .banner .footer { bottom: 72px; font-size: 22px; left: 88px; }
    .banner .signature { position: absolute; left: 1063px; top: 652px; width: 392px; text-align: center; font-size: 19px; color: #adadb9; letter-spacing: .4px; }

    .infographic { height: 1120px; padding: 70px 80px; }
    .infographic h1 { font-size: 62px; }
    .infographic .deck { font-size: 29px; max-width: 1040px; }
    .info-frame { position: absolute; left: 80px; top: 262px; width: 1440px; height: 386px; border: 1.5px solid #4b4b56; border-radius: 24px; background: #111113; }
    .info-frame-label { position: absolute; top: 16px; left: 26px; font-size: 20px; letter-spacing: 1.8px; font-weight: 600; color: #c4c4ce; }
    .info-rail { position: absolute; left: 26px; top: 54px; display: flex; align-items: stretch; }
    .info-step { width: 320px; height: 258px; padding: 22px; border: 1px solid #43434e; border-radius: 16px; background: #1a1b1f; }
    .info-num { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #4d6178; color: #a7ceff; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .info-step .icon { width: 36px; height: 36px; float: right; margin-top: 1px; }
    .info-step h2 { font-size: 32px; font-weight: 600; margin: 12px 0 10px; letter-spacing: -.8px; }
    .info-step p { font-size: 25px; line-height: 1.42; color: #c4c4ce; }
    .info-arrow { width: 28px; display: flex; align-items: center; justify-content: center; color: #6b7b8f; font-size: 26px; }
    .info-turn { position: absolute; left: 26px; top: 324px; width: 1388px; border-top: 1px solid #2d2d35; padding-top: 16px; display: flex; align-items: center; }
    .info-turn-label { font-size: 19px; letter-spacing: 1.7px; color: #8f8f9c; margin-right: 18px; }
    .info-chip { border: 1px solid #43434e; border-radius: 999px; padding: 9px 18px; font-size: 23px; color: #e6e6ec; background: #17181b; white-space: nowrap; }
    .info-chip-arrow { color: #6b7b8f; font-size: 24px; margin: 0 11px; }
    .info-local { position: absolute; left: 80px; top: 682px; width: 700px; }
    .info-local h2 { font-size: 30px; font-weight: 600; margin-bottom: 16px; }
    .info-local ul { margin: 0; padding: 0; list-style: none; }
    .info-local li { font-size: 24px; line-height: 1.4; color: #c4c4ce; margin-bottom: 10px; }
    .info-local li b { color: #e6e6ec; font-weight: 600; }
    .info-local li span { color: #8f8f9c; }
    .info-badges { position: absolute; left: 892px; top: 818px; width: 628px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
    .info-badge { border: 1px solid #43434e; border-radius: 14px; padding: 9px 20px; font-size: 21px; color: #c4c4ce; }
    .info-provider { position: absolute; left: 892px; top: 700px; width: 628px; height: 112px; border: 1px solid #4b4b56; border-radius: 16px; display: flex; align-items: center; gap: 20px; padding: 16px 26px; }
    .info-provider h2 { font-size: 26px; font-weight: 600; margin-bottom: 8px; letter-spacing: -.3px; }
    .info-provider p { font-size: 21px; color: #c4c4ce; }
    .info-egress { position: absolute; left: 892px; top: 648px; width: 628px; height: 52px; }
    .info-egress text { fill: #a7ceff; font-size: 20px; }
    .infographic .footer { bottom: 44px; font-size: 21px; }

    .workspace { height: 1200px; padding: 60px 80px; }
    .workspace h1 { font-size: 59px; }
    .workspace .deck { font-size: 26px; }
    .workspace iframe { position: absolute; left: 80px; top: 242px; width: 1440px; height: 900px; border: 0; pointer-events: none; }
    .feature-labels { display: grid; grid-template-columns: 248px 596px 596px; margin-top: 25px; font-size: 21px; color: #c4c4ce; }
    .feature-labels span { color: #a7ceff; margin-right: 12px; font-size: 17px; }
    .workspace .footer { bottom: 26px; font-size: 18px; }

    .states, .palettes { height: 720px; padding: 70px 80px; }
    .states .deck, .palettes .deck { font-size: 27px; }
    .showcase { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; margin-top: 56px; }
    .character-card { min-width: 0; text-align: center; }
    .character-stage { display: flex; align-items: center; justify-content: center; height: 246px; background: #161618; border: 1px solid #ffffff14; border-radius: 18px; }
    .character-card h2 { font-size: 24px; font-weight: 600; margin-top: 24px; }
    .character-card p { font-size: 18px; line-height: 1.45; margin-top: 9px; color: #adadb9; }
    .states .footer, .palettes .footer { bottom: 42px; font-size: 19px; }
    .palettes .character-stage { position: relative; }
    .palette-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: 3px; }
    .palette-caption { position: absolute; left: 16px; top: 14px; font-size: 12px; letter-spacing: 1.3px; color: #adadb9; text-transform: uppercase; }
  </style>
</head>
<body>
  <main id="artwork"></main>
  <script type="module">
    import { createMascot } from '/src/lib/mascot/engine.ts'
    import { ManualFrameClock } from '/src/lib/mascot/frame-clock.ts'
    import rig from '/src/lib/mascot/characters/owl/rig.svg?raw'
    import motion from '/src/lib/mascot/characters/owl/motion.json'
    import palettes from '/src/lib/mascot/characters/owl/palette.json'

    const root = document.getElementById('artwork')
    const view = new URLSearchParams(location.search).get('view') ?? 'banner'
    const iconPaths = {
      message: '<path d="M17 9a7 7 0 0 1-7 7H5l-3 2 1-5A7 7 0 1 1 17 9Z"/><path d="M7 9h.01M10 9h.01M13 9h.01"/>',
      chip: '<rect x="5" y="5" width="10" height="10" rx="2"/><path d="M7 2v3m6-3v3M7 15v3m6-3v3M2 7h3m-3 6h3m10-6h3m-3 6h3"/>',
      terminal: '<rect x="2" y="3" width="16" height="14" rx="2"/><path d="m6 7 3 3-3 3m5 0h3"/>',
      browser: '<rect x="2" y="3" width="16" height="14" rx="2"/><path d="M2 7h16M5 5h.01M8 5h.01"/>',
      providers: '<ellipse cx="10" cy="4" rx="7" ry="2.5"/><path d="M3 4v11c0 3.4 14 3.4 14 0V4M3 10c0 3.4 14 3.4 14 0"/>',
    }
    const icon = name => `<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${iconPaths[name]}</svg>`
    const owl = (size, state = 'idle', palette = 'maia', className = '') =>
      `<span class="owl ${className}" data-state="${state}" data-palette="${palette}" data-size="${size}" style="width:${size}px;height:${size}px" role="img" aria-label="Pip: ${state}, ${palette} palette"></span>`
    const smallOwl = () => owl(128, 'idle', 'maia', 'small-owl')
    const arrowDefs = `<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#a7ceff" stroke-width="1.5"/></marker></defs>`

    function banner() {
      root.className = 'banner'
      root.innerHTML = `
        <div class="banner-copy">
          <div class="pill">ON YOUR MAC</div>
          <h1>Hermes Desk</h1>
          <p class="deck">Local Hermes agents.<br>A quieter workspace.</p>
        </div>
        <div class="perch"></div>
        ${owl(560, 'idle', 'maia', 'hero-owl')}
        <p class="footer">macOS / Electron / React</p>
        <p class="signature">Pip, the courier owl</p>`
    }

    function infographic() {
      root.className = 'infographic'
      const steps = [
        ['01', 'message', 'React interface', 'Roster, chat, workspace<br>Renders from local state'],
        ['02', 'chip', 'Preload IPC', 'Typed bridge<br>No token in the renderer'],
        ['03', 'terminal', 'Electron main', 'Runtime lifecycle<br>Spawns serve, holds token'],
        ['04', 'providers', 'hermes serve', 'Your Hermes install<br>Profiles, memory, tools'],
      ]
      const turns = ['You type', 'serve streams', 'tool step', 'reply lands']
      const local = [
        ['Chats and drafts', 'transcripts, attachments, per-chat model'],
        ['Rooms', 'membership, approval queue, handoff journal'],
        ['Routines and board', 'schedules, runs, task-board state'],
        ['Settings', 'appearance, connections, preferences'],
        ['Memory and history', 'profile memory, session index, archives'],
      ]
      root.innerHTML = `
        <p class="eyebrow">HOW IT WORKS</p>
        <h1 style="margin-top:16px">One app. Your machine. Your agents.</h1>
        <p class="deck">Four local layers. Only what Hermes sends leaves this Mac.</p>
        ${smallOwl()}
        <div class="info-frame">
          <div class="info-frame-label">YOUR MAC</div>
          <div class="info-rail">
            ${steps.map(([num, iconName, title, detail], index) => `
              ${index ? '<div class="info-arrow">&#8594;</div>' : ''}
              <section class="info-step">
                <span class="info-num">${num}</span>${icon(iconName)}
                <h2>${title}</h2>
                <p>${detail}</p>
              </section>`).join('')}
          </div>
          <div class="info-turn">
            <span class="info-turn-label">ONE TURN</span>
            ${turns.map((turn, index) => `${index ? '<span class="info-chip-arrow">&#8594;</span>' : ''}<span class="info-chip">${turn}</span>`).join('')}
          </div>
        </div>
        <svg class="info-egress" viewBox="0 0 628 60">
          <defs><marker id="egress-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 6 4 1 7" fill="none" stroke="#a7ceff" stroke-width="1.5"/></marker></defs>
          <path d="M314 0V48" fill="none" stroke="#a7ceff" stroke-width="2" marker-end="url(#egress-arrow)"/>
          <text x="332" y="20">model requests</text>
          <text x="332" y="42" style="fill:#8f8f9c">only outbound</text>
        </svg>
        <div class="info-provider">${icon('providers')}<div><h2>Configured model providers</h2><p>Only the calls your profile already makes</p></div></div>
        <div class="info-local">
          <h2>Stays on this Mac</h2>
          <ul>${local.map(([title, detail]) => `<li><b>${title}</b> <span>&#8212; ${detail}</span></li>`).join('')}</ul>
        </div>
        <div class="info-badges">
          <span class="info-badge">No account</span>
          <span class="info-badge">No telemetry</span>
          <span class="info-badge">Tokens stay in main</span>
        </div>
        <p class="footer">Local app, local runtime. Model and tool requests follow your Hermes configuration.</p>`
    }

    function workspace() {
      root.className = 'workspace'
      root.innerHTML = `
        <h1>Conversation, with room to work.</h1>
        <p class="deck">Your agents on the left. The conversation in the middle. Their workspace beside it.</p>
        ${smallOwl()}
        <div class="feature-labels"><p><span>01</span>Your agents</p><p><span>02</span>One conversation</p><p><span>03</span>A native workspace</p></div>
        <iframe title="Illustrative Hermes Desk design preview" src="/tools/design/mockups.html?view=full"></iframe>
        <p class="footer">Illustrative design preview / Local fixture content / Actual in-app mascot</p>`
    }

    function states() {
      root.className = 'states'
      const entries = [
        ['idle', 'Ready', 'A familiar face'],
        ['thinking', 'Thinking', 'Working it through'],
        ['tool', 'Using tools', 'Into the satchel'],
        ['browsing', 'Browsing', 'Eyes on the page'],
        ['waiting', 'Waiting', 'A letter for you'],
        ['sleep', 'Resting', 'A quieter moment'],
      ]
      root.innerHTML = `
        <p class="eyebrow">MEET PIP</p><h1 style="margin-top:16px">A little owl. A lot of personality.</h1>
        <p class="deck">The same courier owl you see in the app, in six of its native state poses.</p>
        <div class="showcase">${entries.map(([state, title, caption]) => `
          <section class="character-card"><div class="character-stage">${owl(210, state)}</div><h2>${title}</h2><p>${caption}</p></section>`).join('')}</div>
        <p class="footer">Real SVG artwork / Native state poses / Frozen for the README, animated in the app</p>`
    }

    function paletteShowcase() {
      root.className = 'palettes'
      const entries = [['maia', 'Blue'], ['sage', 'Sage'], ['iris', 'Iris'], ['honey', 'Honey'], ['mint', 'Mint'], ['rose', 'Rose']]
      root.innerHTML = `
        <p class="eyebrow">ONE COMPANION, EVERY AGENT</p><h1 style="margin-top:16px">Different colours. Still Pip.</h1>
        <p class="deck">One recognizable silhouette across the app's built-in mascot palettes.</p>
        <div class="showcase">${entries.map(([palette, title]) => `
          <section class="character-card"><div class="character-stage"><span class="palette-caption">${palette}</span>${owl(210, 'idle', palette)}</div><h2><span class="palette-dot" style="background:${palettes.agents[palette]['--m-primary']}"></span>${title}</h2><p>Same courier, new colours</p></section>`).join('')}</div>
        <p class="footer">Actual palette.json colours / Same eyes, winged helmet, feathers and messenger satchel</p>`
    }

    const views = { banner, infographic, workspace, states, palettes: paletteShowcase }
    if (!views[view]) throw new Error(`Unknown artwork view: ${view}`)
    views[view]()
    const clock = new ManualFrameClock()
    const handles = [...document.querySelectorAll('.owl')].map((el, i) => createMascot(el, {
      svg: rig, motion, palette: palettes.agents[el.dataset.palette], state: el.dataset.state,
      size: Number(el.dataset.size), reducedMotion: true, autonomy: false, interactive: false,
      seed: `readme-${i}`, clock,
    }))
    clock.advance(100)
    handles.forEach(handle => handle.pause())
    await document.fonts.ready
    await Promise.all([...document.images].map(image => image.decode()))
    const iframe = document.querySelector('iframe')
    if (iframe) {
      const deadline = performance.now() + 15000
      while (!iframe.contentWindow?.deskDesign?.ready) {
        if (performance.now() > deadline) throw new Error('Design preview did not initialize')
        await new Promise(requestAnimationFrame)
      }
    }
    window.readmeArtwork = { ready: true, view, owlCount: handles.length }
  </script>
</body>
</html>
