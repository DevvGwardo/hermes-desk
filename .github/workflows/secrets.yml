name: secrets

# A backstop, not the first line of defence: server-side push protection blocks
# a credential before it lands. This scans the two paths that can still deliver
# bytes — pull requests and direct pushes to main (agents push to main daily).
# It is scoped to the event's own commits, so it stays seconds long and never
# re-litigates history.
#
# The scanner is a pinned release binary with a pinned checksum rather than a
# third-party action, so the supply chain here is one tarball.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: gitleaks (commits in this event)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan this event's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          gitleaks version
          zero=0000000000000000000000000000000000000000
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -z "${AFTER_SHA:-}" ] || [ "$AFTER_SHA" = "$zero" ]; then
            echo "No pushed commit to scan (branch deleted); nothing to do."
            exit 0
          elif [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "$zero" ]; then
            # New branch: there is nothing before it, so scan the one commit.
            range="${AFTER_SHA}^..${AFTER_SHA}"
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "Scanning $range"
          gitleaks detect --source . --no-banner --redact --log-opts="$range" --exit-code 1
